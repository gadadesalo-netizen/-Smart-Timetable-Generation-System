<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">Classroom Management</span>
        <a href="/dashboard" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-4">

<div class="card shadow">

<div class="card-header">
<h4>Add Classroom</h4>
</div>

<div class="card-body">

<div class="row">

<div class="col-md-6">
<input id="room_no" class="form-control" placeholder="Room Number">
</div>

<div class="col-md-6">
<input id="capacity" type="number" class="form-control" placeholder="Capacity">
</div>

</div>

<br>

<button onclick="saveClassroom()" class="btn btn-success">
Save Classroom
</button>

</div>

</div>

<br>

<div class="card shadow">

<div class="card-header">
<h4>Classroom List</h4>
</div>

<div class="card-body">

<table class="table table-bordered">

<thead class="table-primary">
<tr>
<th>ID</th>
<th>Room Number</th>
<th>Capacity</th>
</tr>
</thead>

<tbody id="classroomTable">
</tbody>

</table>

</div>

</div>

</div>

<script src="/static/classrooms.js"></script>

</body>
</html>
