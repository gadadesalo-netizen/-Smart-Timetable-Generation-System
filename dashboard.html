<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container-fluid">

<span class="navbar-brand">

Smart Timetable Generation System

</span>

</div>

</nav>

<div class="container mt-4">

<div class="row">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Total Faculty</h5>

<h2 id="facultyCount">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Total Subjects</h5>

<h2 id="subjectCount">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Total Divisions</h5>

<h2 id="divisionCount">0</h2>

</div>

</div>

</div>

</div>

<div class="row mt-3">

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Classrooms</h5>

<h2 id="roomCount">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Laboratories</h5>

<h2 id="labCount">0</h2>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<div class="card-body text-center">

<h5>Timetable Entries</h5>

<h2 id="ttCount">0</h2>

</div>

</div>

</div>

</div>

<hr>

<div class="mt-4">

<a href="faculty.html" class="btn btn-primary">Faculty</a>

<a href="subjects.html" class="btn btn-success">Subjects</a>

<a href="divisions.html" class="btn btn-warning">Divisions</a>

<a href="classrooms.html" class="btn btn-info">Classrooms</a>

<a href="labs.html" class="btn btn-secondary">Laboratories</a>

<a href="timetable.html" class="btn btn-danger">Timetable</a>

</div>

</div>

<script src="/static/app.js"></script>

</body>

</html>
