<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
        <span class="navbar-brand">Subject Management</span>
        <a href="/dashboard" class="btn btn-light">Dashboard</a>
    </div>
</nav>

<div class="container mt-4">

<div class="card shadow">

<div class="card-header">
<h4>Add Subject</h4>
</div>

<div class="card-body">

<div class="row">

<div class="col-md-4">
<input id="subject_code" class="form-control" placeholder="Subject Code">
</div>

<div class="col-md-4">
<input id="subject_name" class="form-control" placeholder="Subject Name">
</div>

<div class="col-md-4">
<input id="academic_year" class="form-control" placeholder="Academic Year">
</div>

</div>

<br>

<div class="row">

<div class="col-md-4">
<input id="division" class="form-control" placeholder="Division">
</div>

<div class="col-md-4">
<input id="faculty" class="form-control" placeholder="Faculty">
</div>

<div class="col-md-4">
<select id="subject_type" class="form-control">
<option>Theory</option>
<option>Practical</option>
</select>
</div>

</div>

<br>

<div class="row">

<div class="col-md-4">
<input id="weekly_limit" type="number" class="form-control" placeholder="Weekly Hours">
</div>

</div>

<br>

<button onclick="saveSubject()" class="btn btn-success">
Save Subject
</button>

</div>

</div>

<br>

<div class="card shadow">

<div class="card-header">
<h4>Subject List</h4>
</div>

<div class="card-body">

<table class="table table-bordered">

<thead class="table-primary">

<tr>

<th>ID</th>
<th>Code</th>
<th>Name</th>
<th>Year</th>
<th>Division</th>
<th>Faculty</th>
<th>Type</th>
<th>Hours</th>

</tr>

</thead>

<tbody id="subjectTable">

</tbody>

</table>

</div>

</div>

</div>

<script src="/static/subjects.js"></script>

</body>
</html>
